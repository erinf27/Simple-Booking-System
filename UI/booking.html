<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry Booking</title>
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="mainbody">
    <nav class="navbar">
        <ul>
            <li><button id="dateBtn">Date: <span id="currentDateDisplay">Today</span></button></li>
            <li><a href="#Washing">Washing Machines</a></li>
            <li><a href="#Drying">Dryers</a></li>
            <li><button type="button" class="text-link-button" id="signOutBtn">
                Sign Out
            </button></li>
        </ul>
    </nav>

    <dialog id="popupDate">
        <h2>Pick a Date</h2>
        <p>Select a day for your laundry booking.</p>
        
        <div class="date-shortcuts">
            <button type="button" class="shortcut-btn" data-offset="0">Today</button>
            <button type="button" class="shortcut-btn" data-offset="1">Tomorrow</button>
            <button type="button" class="shortcut-btn" data-offset="2">In 2 Days</button>
        </div>

        <input type="date" id="bookDate" min=today.getTime()>
        
        <div class="modal-actions">
            <button id="closeBtn">Close</button>
        </div>
    </dialog>

    <div class="content-wrapper">
        <!-- Added section-heading class for scroll margin -->
        <div class="washing" id="Washing">
            <h1 class="section-heading">Washing Machines</h1>
            <table id="washing-grid" class="sticky-header">
                <thead class="machine-nums">
                    <tr id="washing-head">
                        <th></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        
        <div class="dryer" id="Drying">
            <h1 class="section-heading">Dryers</h1>
            <table id="dryer-grid" class="sticky-header">
                <thead>
                    <tr id="dryer-head">
                        <th></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="submit-container">
            <button class="submitBtn" type="submit" id="submitBtn">Submit Booking</button>
        </div>
        <div id="message"></div>
    </div>

    <script type="module" src="js/booking.js"></script>
</body>
</html>
